<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>判例ノート</title>
<meta name="description" content="企業法務で使う重要判例と実務ポイントのノート">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1D2430;
    --muted: #5F6773;
    --line: #E3DED3;
    --accent: #1F3A5F;
    --accent-soft: #E6ECF4;
    --gold: #B0802A;
    --ok: #2F7A4F;
    --ok-soft: #E4F2E9;
    --warn: #9A5B12;
    --warn-soft: #FBF0DD;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181F; --card: #1C222B; --ink: #E7E9ED; --muted: #9AA3AF; --line: #2C3440;
      --accent: #8FB0DA; --accent-soft: #233247; --gold: #D9AE5F;
      --ok: #7CC79B; --ok-soft: #1D3328; --warn: #E3B06A; --warn-soft: #3A2D1A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181F; --card: #1C222B; --ink: #E7E9ED; --muted: #9AA3AF; --line: #2C3440;
    --accent: #8FB0DA; --accent-soft: #233247; --gold: #D9AE5F;
    --ok: #7CC79B; --ok-soft: #1D3328; --warn: #E3B06A; --warn-soft: #3A2D1A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); line-height: 1.75; font-size: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* header */
  header.top { padding: 28px 0 12px; }
  header.top h1 { font-family: var(--serif); font-size: 28px; margin: 0; letter-spacing: .04em; color: var(--accent); }
  header.top p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .search {
    width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-size: 16px; outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .count { color: var(--muted); font-size: 13px; margin: 8px 2px; }

  /* list */
  .list { display: grid; gap: 10px; }
  .item {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: inherit;
  }
  .item:hover { border-color: var(--accent); }
  .item .row { display: flex; align-items: flex-start; gap: 8px; }
  .item h2 { font-family: var(--serif); font-size: 17px; margin: 0; flex: 1; line-height: 1.5; }
  .item .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; }
  .tag.area { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .tag.lower { background: var(--warn-soft); color: var(--warn); }
  .star { color: var(--gold); font-size: 16px; }
  .ok-mark { color: var(--ok); font-size: 12px; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* detail */
  .back {
    display: inline-flex; align-items: center; gap: 4px; margin: 18px 0 8px; padding: 6px 10px 6px 4px;
    border: none; background: none; color: var(--accent); font-size: 15px;
  }
  .detail h1 { font-family: var(--serif); font-size: 24px; line-height: 1.45; margin: 4px 0 6px; }
  .detail .meta { color: var(--muted); font-size: 14px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
  .btn {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-size: 14px;
  }
  a.btn { display: inline-block; text-decoration: none; color: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .btn.on-star { border-color: var(--gold); color: var(--gold); }
  .btn.on-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
  .notice {
    background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin: 12px 0 4px;
  }
  section.block { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-top: 12px; }
  section.block h3 {
    margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; color: var(--accent); font-weight: 700;
  }
  section.block p { margin: 0; }
  section.block ul { margin: 0; padding-left: 1.2em; }
  section.block li + li { margin-top: 6px; }
  section.holding { border-left: 4px solid var(--accent); }
  section.points { border-left: 4px solid var(--gold); }
  section.commentary { border-left: 4px solid var(--muted); }
  .memo {
    width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    background: var(--bg); resize: vertical; line-height: 1.7; font-size: 15px;
  }
  .saved { color: var(--muted); font-size: 12px; height: 18px; margin-top: 4px; }
  a.ext { color: var(--accent); }

  /* 関連判例・上級審 */
  .rel-group + .rel-group { margin-top: 12px; }
  .rel-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .rel-link {
    display: block; padding: 8px 10px; margin-top: 6px; border-radius: 10px; background: var(--bg);
    color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 15px;
  }
  .rel-link span { display: block; font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .rel-link:hover { background: var(--accent-soft); }
  section.follows { border-left: 4px solid var(--warn); }
  .follow + .follow { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .follow-head { font-size: 14px; }
  .follow p { margin: 4px 0; font-size: 14px; }
  .sub-note { color: var(--muted); font-size: 14px; }
  .tag.follow-tag { background: var(--warn-soft); color: var(--warn); text-decoration: none; }

  /* tabs */
  .tabs { display: flex; gap: 4px; background: var(--accent-soft); border-radius: 12px; padding: 4px; margin: 4px 0 14px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 9px; text-decoration: none;
    color: var(--accent); font-size: 15px; font-weight: 600;
  }
  .tab[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .badge {
    display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px;
    background: var(--gold); color: #fff; font-size: 12px; line-height: 20px; vertical-align: 1px;
  }

  /* watch */
  .watch-info { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .count-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .linkbtn { border: none; background: none; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .witem { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .witem.unread { border-left: 4px solid var(--gold); }
  .witem h2 { font-family: var(--serif); font-size: 16px; margin: 0; line-height: 1.5; }
  .witem .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .witem .point { margin: 8px 0 0; font-size: 14px; white-space: pre-line; }
  .witem .point.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .witem .sub { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-line; }
  .witem .actions { margin: 10px 0 0; }
  .witem .btn { padding: 6px 12px; font-size: 13px; }
  .tag.new { background: var(--gold); color: #fff; }
  .tag.in-note { background: var(--ok-soft); color: var(--ok); }

  footer.tools { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  footer.tools .actions { margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 一覧 -->
  <main id="listView">
    <header class="top">
      <h1>判例ノート</h1>
      <p>企業法務の重要判例と実務ポイント</p>
    </header>
    <div class="tabs" role="tablist">
      <a class="tab" id="tabNotes" href="#" role="tab">判例ノート</a>
      <a class="tab" id="tabWatch" href="#new" role="tab">新着判例<span class="badge" id="unreadBadge" hidden></span></a>
    </div>

    <section id="notesSection">
      <input id="q" class="search" type="search" placeholder="事件名・論点・条文で検索（例：内部統制、429条）" autocomplete="off">
      <div class="chips" id="chips" role="toolbar" aria-label="絞り込み"></div>
      <div class="count" id="count"></div>
      <div class="list" id="list"></div>
    </section>

    <section id="watchSection" hidden>
      <p class="watch-info" id="watchInfo"></p>
      <input id="wq" class="search" type="search" placeholder="事件名・判示事項で検索" autocomplete="off">
      <div class="chips" id="wchips" role="toolbar" aria-label="新着の絞り込み"></div>
      <div class="count-row"><span class="count" id="wcount"></span><button class="linkbtn" id="markAllBtn">表示中をすべて既読にする</button></div>
      <div class="list" id="wlist"></div>
    </section>

    <footer class="tools">
      ★・確認済み・メモは、この端末のブラウザの中だけに保存されます。機種変更の前などには書き出しておいてください。
      <div class="actions">
        <button class="btn" id="exportBtn">メモ等を書き出す</button>
        <button class="btn" id="importBtn">読み込む</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </footer>
  </main>

  <!-- 詳細 -->
  <article id="detailView" class="detail" hidden></article>

</div>

<script src="cases.js"></script>
<script src="data/company.js"></script>
<script src="data/securities.js"></script>
<script src="data/ma.js"></script>
<script src="data/antitrust.js"></script>
<script src="data/subcontract.js"></script>
<script src="data/advertising.js"></script>
<script src="data/privacy.js"></script>
<script src="data/civil.js"></script>
<script src="data/labor.js"></script>
<script src="data/related.js"></script>
<script src="data/watch.js"></script>
<script>
(() => {
  const KEY = "hanrei-note:v1";
  const SEARCH_URL = "https://www.courts.go.jp/hanrei/search1/index.html";
  const load = () => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  };
  const EMPTY = () => ({ fav: {}, ok: {}, memo: {}, wRead: {}, wFav: {} });
  let store = Object.assign(EMPTY(), load());
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 同じ id が複数回読み込まれても（古いキャッシュが混ざった場合など）、後から読み込んだものだけを使う
  const seen = new Set();
  const LIST = CASES.slice().reverse().filter((c) => !seen.has(c.id) && seen.add(c.id)).reverse();
  const byId = Object.fromEntries(LIST.map((c) => [c.id, c]));
  const lowerTag = (c) => c.court.startsWith("最高裁") ? "" : '<span class="tag lower">下級審</span>';

  // 関連判例：id → [[グループ名, [id...]], ...]
  const relatedOf = {};
  (typeof RELATED === "undefined" ? [] : RELATED).forEach(([name, ids]) => ids.forEach((id) => {
    (relatedOf[id] ||= []).push([name, ids.filter((x) => x !== id && byId[x])]);
  }));

  // 上級審の追跡：新着判例の「原審」が判例ノートの下級審と一致するか（automation/watch.mjs と同じ規則）
  const normCaseNo = (s) => {
    const m = (s || "").replace(/\s/g, "").match(/(令和|平成|昭和)(元|\d+)年?\(([^)]+)\)第?(\d+)号?/);
    return m ? `${m[1]}${m[2] === "元" ? 1 : +m[2]}(${m[3]})${+m[4]}` : "";
  };
  const normCourt = (s) => (s || "").replace(/\s/g, "").replace(/地裁/, "地方裁判所").replace(/高裁/, "高等裁判所");
  const lowerNotes = LIST.filter((c) => !c.court.startsWith("最高裁"))
    .map((c) => ({ id: c.id, court: normCourt(c.court), caseNo: normCaseNo(c.caseNo || c.source) })).filter((n) => n.caseNo);
  const followOf = (i) => {
    if (i.follows && byId[i.follows]) return i.follows;
    const g = (i.gensin || "").replace(/\s/g, ""); const no = normCaseNo(g);
    const hit = no && lowerNotes.find((n) => n.caseNo === no && g.startsWith(n.court));
    return hit ? hit.id : "";
  };

  // ---- 一覧 ----
  const areas = [...new Set(LIST.map((c) => c.area))];
  const filters = [{ key: "all", label: "すべて" }, ...areas.map((a) => ({ key: "area:" + a, label: a })),
    { key: "fav", label: "★ お気に入り" }, { key: "unchecked", label: "未確認" }, { key: "memo", label: "メモあり" }];
  let current = "all";

  function renderChips() {
    $("chips").innerHTML = filters.map((f) =>
      `<button class="chip" data-key="${esc(f.key)}" aria-pressed="${f.key === current}">${esc(f.label)}</button>`).join("");
  }
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    current = b.dataset.key; renderChips(); renderList();
  });

  const haystack = (c) => [c.title, c.court, c.date, c.source, c.area, ...c.topics, c.facts, c.holding, c.commentary || "", ...c.points, ...c.articles, store.memo[c.id] || ""].join(" ");
  const norm = (s) => s.normalize("NFKC").toLowerCase();

  function renderList() {
    const words = norm($("q").value).split(/\s+/).filter(Boolean);
    const shown = LIST.filter((c) => {
      if (current.startsWith("area:") && c.area !== current.slice(5)) return false;
      if (current === "fav" && !store.fav[c.id]) return false;
      if (current === "unchecked" && store.ok[c.id]) return false;
      if (current === "memo" && !(store.memo[c.id] || "").trim()) return false;
      const h = norm(haystack(c));
      return words.every((w) => h.includes(w));
    });
    $("count").textContent = `${shown.length}件 / 全${LIST.length}件`;
    $("list").innerHTML = shown.length ? shown.map((c) => `
      <a class="item" href="#${esc(c.id)}">
        <div class="row">
          <h2>${esc(c.title)}</h2>
          ${store.fav[c.id] ? '<span class="star" aria-label="お気に入り">★</span>' : ""}
        </div>
        <div class="meta">${esc(c.court)}　${esc(c.date)}　${store.ok[c.id] ? '<span class="ok-mark">✓ 確認済み</span>' : ""}</div>
        <div class="tags"><span class="tag area">${esc(c.area)}</span>${lowerTag(c)}${c.topics.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </a>`).join("") : '<div class="empty">該当する判例がありません</div>';
  }
  $("q").addEventListener("input", renderList);

  // ---- 詳細 ----
  let saveTimer;

  // 下級審の「上級審・その後」欄（手動で登録した appeals ＋ 新着ウォッチで見つかったもの）
  function renderFollowUps(c) {
    if (c.court.startsWith("最高裁")) return "";
    const manual = (c.appeals || []).map((a) => `
      <div class="follow">
        <div class="follow-head">${esc(a.court)}　${esc(a.date)}　<strong>${esc(a.result)}</strong></div>
        ${a.note ? `<p>${esc(a.note)}</p>` : ""}
        ${a.url ? `<a class="ext" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.caseNo || "裁判所サイト")} ↗</a>` : ""}
      </div>`);
    const auto = W.items.filter((i) => followOf(i) === c.id).map((i) => `
      <div class="follow auto">
        <div class="follow-head">${esc(i.court)}　${esc(i.date)}　<strong>${esc(i.result || i.type)}</strong>　<span class="tag new">自動検出</span></div>
        ${i.point || i.summary ? `<p>${esc(i.point || i.summary)}</p>` : ""}
        <a class="ext" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.caseNo)} ↗</a>
      </div>`);
    const body = manual.concat(auto).join("") ||
      '<p class="sub-note">裁判所サイトでは上級審の判断は見つかっていません（掲載されていない可能性もあります）。新着判例ウォッチで毎日自動的に確認しています。</p>';
    return `<section class="block follows"><h3>上級審・その後</h3>${body}</section>`;
  }
  function renderDetail(c) {
    const v = $("detailView");
    v.innerHTML = `
      <button class="back" id="backBtn">‹ 一覧へ</button>
      <div class="tags"><span class="tag area">${esc(c.area)}</span>${lowerTag(c)}${c.topics.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <h1>${esc(c.title)}</h1>
      <div class="meta">${esc(c.court)}　${esc(c.date)}　${esc(c.source)}</div>
      <div class="actions">
        <button class="btn ${store.fav[c.id] ? "on-star" : ""}" id="favBtn">${store.fav[c.id] ? "★ お気に入り" : "☆ お気に入り"}</button>
        <button class="btn ${store.ok[c.id] ? "on-ok" : ""}" id="okBtn">${store.ok[c.id] ? "✓ 原典で確認済み" : "原典で確認した"}</button>
      </div>
      ${c.url
        ? `<a class="btn primary" href="${esc(c.url)}" target="_blank" rel="noopener">裁判所サイトで全文を読む ↗</a>`
        : `<a class="btn" href="${SEARCH_URL}" target="_blank" rel="noopener">裁判所サイトで検索する ↗</a><div class="meta" style="margin-top:6px;font-size:13px">この裁判例は裁判所サイトに掲載がありません。判例集等で確認してください。</div>`}
      ${store.ok[c.id] ? "" : '<div class="notice">判旨は裁判所サイトの裁判要旨・判決文をもとにした要約、解説・実務ポイントはこのノートの独自のまとめです。原典で確認してから使ってください。</div>'}
      <section class="block"><h3>事案</h3><p>${esc(c.facts)}</p></section>
      <section class="block holding"><h3>判旨（要約）</h3><p>${esc(c.holding)}</p></section>
      ${c.commentary ? `<section class="block commentary"><h3>解説</h3><p>${esc(c.commentary)}</p></section>` : ""}
      <section class="block points"><h3>実務ポイント</h3><ul>${c.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></section>
      <section class="block"><h3>関連条文</h3><p>${c.articles.map(esc).join("、")}</p></section>
      ${renderFollowUps(c)}
      ${relatedOf[c.id] ? `<section class="block related"><h3>関連判例</h3>${relatedOf[c.id].map(([name, ids]) => `
        <div class="rel-group"><div class="rel-name">${esc(name)}</div>
        ${ids.map((id) => `<a class="rel-link" href="#${esc(id)}">${esc(byId[id].title)}<span>${esc(byId[id].court)}　${esc(byId[id].date)}</span></a>`).join("")}</div>`).join("")}
      </section>` : ""}
      <section class="block">
        <h3>自分メモ</h3>
        <textarea class="memo" id="memo" placeholder="案件で使った場面、関連する裁判例、気づいたことなど">${esc(store.memo[c.id] || "")}</textarea>
        <div class="saved" id="saved"></div>
      </section>
      `;
    $("backBtn").onclick = () => { if (history.length > 1) history.back(); else location.hash = ""; };
    $("favBtn").onclick = () => { store.fav[c.id] = !store.fav[c.id]; if (!store.fav[c.id]) delete store.fav[c.id]; save(); renderDetail(c); };
    $("okBtn").onclick = () => { store.ok[c.id] = !store.ok[c.id]; if (!store.ok[c.id]) delete store.ok[c.id]; save(); renderDetail(c); };
    $("memo").addEventListener("input", (e) => {
      const val = e.target.value;
      if (val.trim()) store.memo[c.id] = val; else delete store.memo[c.id];
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { save(); $("saved").textContent = "保存しました"; }, 400);
    });
  }

  // ---- 新着判例 ----
  const W = typeof WATCH === "undefined" ? { updated: "", items: [] } : WATCH;
  const noteUrls = new Set(LIST.map((c) => c.url).filter(Boolean));
  const wAreas = [...new Set(W.items.flatMap((i) => i.areas))].filter((a) => a !== "その他");
  const wFilters = [{ key: "all", label: "すべて" }, { key: "unread", label: "未読" }, { key: "fav", label: "☆ 気になる" },
    { key: "sc", label: "最高裁" }, { key: "lower", label: "下級審" }, ...wAreas.map((a) => ({ key: "area:" + a, label: a }))];
  let wCurrent = "all";

  function updateBadge() {
    const n = W.items.filter((i) => !store.wRead[i.id]).length;
    $("unreadBadge").hidden = !n;
    $("unreadBadge").textContent = n;
  }
  function wShown() {
    const words = norm($("wq").value).split(/\s+/).filter(Boolean);
    return W.items.filter((i) => {
      if (wCurrent === "unread" && store.wRead[i.id]) return false;
      if (wCurrent === "fav" && !store.wFav[i.id]) return false;
      if (wCurrent === "sc" && i.kind !== "最高裁") return false;
      if (wCurrent === "lower" && i.kind !== "下級審") return false;
      if (wCurrent.startsWith("area:") && !i.areas.includes(wCurrent.slice(5))) return false;
      const h = norm([i.name, i.caseNo, i.court, i.point, i.summary, i.refs, ...i.areas].join(" "));
      return words.every((w) => h.includes(w));
    });
  }
  function renderWatch() {
    $("watchInfo").textContent = W.updated
      ? `最終更新 ${W.updated}（毎朝9時に裁判所ウェブサイトを自動巡回）`
      : "まだ巡回結果がありません。";
    $("wchips").innerHTML = wFilters.map((f) =>
      `<button class="chip" data-key="${esc(f.key)}" aria-pressed="${f.key === wCurrent}">${esc(f.label)}</button>`).join("");
    const shown = wShown();
    $("wcount").textContent = `${shown.length}件 / 全${W.items.length}件`;
    $("wlist").innerHTML = shown.length ? shown.map((i) => {
      const unread = !store.wRead[i.id];
      const text = i.point || i.summary;
      return `
      <div class="witem ${unread ? "unread" : ""}" data-id="${esc(i.id)}">
        <div class="tags" style="margin:0 0 6px">
          ${unread ? '<span class="tag new">NEW</span>' : ""}
          <span class="tag ${i.kind === "下級審" ? "lower" : "area"}">${esc(i.kind)}</span>
          ${i.areas.filter((a) => a !== "その他").map((a) => `<span class="tag">${esc(a)}</span>`).join("")}
          ${noteUrls.has(i.url) ? '<span class="tag in-note">ノート収録済み</span>' : ""}
          ${followOf(i) ? `<a class="tag follow-tag" href="#${esc(followOf(i))}">ノート判例の上級審：${esc(byId[followOf(i)].title)}</a>` : ""}
        </div>
        <h2>${esc(i.name || i.caseNo)}</h2>
        <div class="meta">${esc(i.court)}　${esc(i.date)}${i.type ? "　" + esc(i.type) : ""}${i.result ? "（" + esc(i.result) + "）" : ""}</div>
        ${text ? `<p class="point clamp">${esc(text)}</p>` : '<p class="sub">要旨の掲載はまだありません。全文（PDF）で確認してください。</p>'}
        ${i.summary && i.point ? `<p class="sub" hidden data-more>【裁判要旨】${esc(i.summary)}</p>` : ""}
        <p class="sub" hidden data-more>${esc(i.caseNo)}${i.source ? "　" + esc(i.source) : ""}${i.gensin ? "\n原審：" + esc(i.gensin) : ""}${i.refs ? "\n参照法条：" + esc(i.refs) : ""}</p>
        <div class="actions">
          <a class="btn primary" href="${esc(i.url)}" target="_blank" rel="noopener" data-act="open">裁判所サイトで読む ↗</a>
          <button class="btn" data-act="more">詳しく</button>
          <button class="btn ${store.wFav[i.id] ? "on-star" : ""}" data-act="fav">${store.wFav[i.id] ? "★ 気になる" : "☆ 気になる"}</button>
          ${unread ? '<button class="btn" data-act="read">既読にする</button>' : ""}
        </div>
      </div>`;
    }).join("") : '<div class="empty">該当する新着判例はありません</div>';
    updateBadge();
  }
  $("wchips").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    wCurrent = b.dataset.key; renderWatch();
  });
  $("wq").addEventListener("input", renderWatch);
  $("wlist").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const card = el.closest(".witem"); const id = card.dataset.id;
    const act = el.dataset.act;
    if (act === "more") {
      card.querySelector(".point")?.classList.toggle("clamp");
      card.querySelectorAll("[data-more]").forEach((p) => { p.hidden = !p.hidden; });
      el.textContent = el.textContent === "詳しく" ? "閉じる" : "詳しく";
      return;
    }
    if (act === "fav") { store.wFav[id] = !store.wFav[id]; if (!store.wFav[id]) delete store.wFav[id]; }
    if (act === "read" || act === "open") store.wRead[id] = true;
    save();
    if (act !== "open") renderWatch(); else setTimeout(renderWatch, 300);
  });
  $("markAllBtn").onclick = () => { wShown().forEach((i) => { store.wRead[i.id] = true; }); save(); renderWatch(); };

  // ---- 画面切り替え（#id で詳細、#new で新着判例） ----
  function route() {
    const key = decodeURIComponent(location.hash.slice(1));
    const c = byId[key];
    const watch = key === "new";
    $("listView").hidden = !!c;
    $("detailView").hidden = !c;
    if (c) { renderDetail(c); window.scrollTo(0, 0); return; }
    $("notesSection").hidden = watch;
    $("watchSection").hidden = !watch;
    $("tabNotes").setAttribute("aria-selected", String(!watch));
    $("tabWatch").setAttribute("aria-selected", String(watch));
    if (watch) renderWatch(); else { renderChips(); renderList(); updateBadge(); }
  }
  window.addEventListener("hashchange", route);

  // ---- 書き出し・読み込み ----
  $("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `hanrei-note-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!confirm("今のメモ等を、読み込んだファイルの内容で上書きします。よろしいですか？")) return;
      store = Object.assign(EMPTY(), data);
      save(); route(); alert("読み込みました");
    } catch { alert("読み込めませんでした。書き出したファイルを選んでください。"); }
    e.target.value = "";
  };

  route();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
